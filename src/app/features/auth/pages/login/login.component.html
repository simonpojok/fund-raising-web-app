<div class="card slide-in-up">
  <div class="text-center mb-6">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Welcome Back</h1>
    <p class="mt-2 text-gray-600 dark:text-gray-300">Sign in to your account to continue</p>
  </div>

  <!-- Alert for errors -->
  <app-alert
    *ngIf="errorMessage"
    type="error"
    [message]="errorMessage"
    class="mb-4"
    (dismissed)="errorMessage = ''"
  ></app-alert>

  <!-- Login Form -->
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Email Input -->
    <app-input
      label="Email Address"
      type="email"
      formControlName="email"
      placeholder="Your email address"
      autocomplete="email"
      [icon]="'fas fa-envelope'"
      iconPosition="left"
      [validationMessages]="{
        required: 'Email is required',
        email: 'Please enter a valid email address'
      }"
      [required]="true"
    ></app-input>

    <!-- Password Input -->
    <app-input
      label="Password"
      type="password"
      formControlName="password"
      placeholder="Your password"
      autocomplete="current-password"
      [icon]="'fas fa-lock'"
      iconPosition="left"
      [validationMessages]="{
        required: 'Password is required',
        minlength: 'Password must be at least 6 characters'
      }"
      [required]="true"
    ></app-input>

    <!-- Remember Me & Forgot Password -->
    <div class="flex items-center justify-between">
      <div class="flex items-center">
        <input
          id="rememberMe"
          type="checkbox"
          formControlName="rememberMe"
          class="w-4 h-4 text-primary-600 border-gray-300 rounded focus:ring-primary-500 dark:bg-gray-800 dark:border-gray-700 dark:checked:bg-primary-600"
        >
        <label for="rememberMe" class="ml-2 text-sm text-gray-700 dark:text-gray-300">Remember me</label>
      </div>

      <a routerLink="/auth/forgot-password" class="text-sm text-primary-600 hover:text-primary-700 dark:text-primary-400 dark:hover:text-primary-300">
        Forgot your password?
      </a>
    </div>

    <!-- Submit Button -->
    <app-button
      type="submit"
      variant="primary"
      [fullWidth]="true"
      [loading]="isLoading"
      [disabled]="loginForm.invalid || isLoading"
    >
      Sign In
    </app-button>
  </form>

  <!-- Register Link -->
  <div class="mt-6 text-center">
    <p class="text-sm text-gray-600 dark:text-gray-400">
      Don't have an account?
      <a routerLink="/auth/register" class="text-primary-600 hover:text-primary-700 dark:text-primary-400 dark:hover:text-primary-300 font-medium">
        Create Account
      </a>
    </p>
  </div>
</div>
