<div class="card slide-in-up">
  <div class="text-center mb-6">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Welcome Back</h1>
    <p class="mt-2 text-gray-600 dark:text-gray-300">Sign in to your account to continue</p>
  </div>

  <!-- Alert for errors -->
  <app-alert
    *ngIf="errorMessage"
    type="error"
    [message]="errorMessage"
    class="mb-4"
    (dismissed)="errorMessage = ''"
  ></app-alert>

  <!-- Login Form -->
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Email Input -->
    <div class="w-full mb-4">
      <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
        Email Address <span class="text-danger ml-0.5">*</span>
      </label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-500 dark:text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
          </svg>
        </div>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="Your email address"
          autocomplete="email"
          class="block w-full pl-10 pr-4 py-2 rounded-lg border border-gray-300 dark:border-gray-700 shadow-sm focus:border-primary-500 focus:ring focus:ring-primary-500 focus:ring-opacity-50 dark:bg-gray-800 dark:text-white transition-colors duration-200"
          [class.border-danger-500]="loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)"
        >
      </div>
      <div *ngIf="loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)" class="mt-1 text-danger text-sm">
        <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</span>
        <span *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email address</span>
      </div>
    </div>

    <!-- Password Input -->
    <div class="w-full mb-4">
      <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
        Password <span class="text-danger ml-0.5">*</span>
      </label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-500 dark:text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <input
          [type]="showPassword ? 'text' : 'password'"
          id="password"
          formControlName="password"
          placeholder="Your password"
          autocomplete="current-password"
          class="block w-full pl-10 pr-10 py-2 rounded-lg border border-gray-300 dark:border-gray-700 shadow-sm focus:border-primary-500 focus:ring focus:ring-primary-500 focus:ring-opacity-50 dark:bg-gray-800 dark:text-white transition-colors duration-200"
          [class.border-danger-500]="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)"
        >
        <!-- Password visibility toggle -->
        <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
          <button
            type="button"
            tabindex="-1"
            class="text-gray-500 dark:text-gray-400 focus:outline-none hover:text-gray-700 dark:hover:text-gray-200"
            (click)="togglePasswordVisibility()"
          >
            <!-- Eye icon when password is hidden -->
            <svg
              *ngIf="!showPassword"
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
              />
            </svg>

            <!-- Eye-off icon when password is visible -->
            <svg
              *ngIf="showPassword"
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"
              />
            </svg>
          </button>
        </div>
      </div>
      <div *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)" class="mt-1 text-danger text-sm">
        <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
        <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters</span>
      </div>
    </div>

    <!-- Remember Me & Forgot Password -->
    <div class="flex items-center justify-between pb-8">
      <div class="flex items-center">
        <input
          id="rememberMe"
          type="checkbox"
          formControlName="rememberMe"
          class="w-4 h-4 text-primary-600 border-gray-300 rounded focus:ring-primary-500 dark:bg-gray-800 dark:border-gray-700 dark:checked:bg-primary-600"
        >
        <label for="rememberMe" class="ml-2 text-sm text-gray-700 dark:text-gray-300">Remember me</label>
      </div>

      <a routerLink="/auth/forgot-password" class="text-sm text-primary-600 hover:text-primary-700 dark:text-primary-400 dark:hover:text-primary-300 hover:underline transition-colors duration-200">
        Forgot your password?
      </a>
    </div>

    <!-- Submit Button -->
    <app-button
      type="submit"
      variant="primary"
      [fullWidth]="true"
      [loading]="isLoading"
      [disabled]="loginForm.invalid || isLoading"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
      </svg>
      Sign In
    </app-button>
  </form>

  <!-- Register Link -->
  <div class="mt-6 text-center">
    <p class="text-sm text-gray-600 dark:text-gray-400">
      Don't have an account?
      <a routerLink="/auth/register" class="text-primary-600 hover:text-primary-700 dark:text-primary-400 dark:hover:text-primary-300 font-medium hover:underline transition-colors duration-200">
        Create Account
      </a>
    </p>
  </div>

  <!-- Additional Links -->
  <div class="mt-4 text-center">
    <div class="text-xs text-gray-500 dark:text-gray-400 space-x-4">
      <a href="#" class="hover:text-gray-700 dark:hover:text-gray-300 hover:underline transition-colors duration-200">Terms of Service</a>
      <a href="#" class="hover:text-gray-700 dark:hover:text-gray-300 hover:underline transition-colors duration-200">Privacy Policy</a>
      <a href="#" class="hover:text-gray-700 dark:hover:text-gray-300 hover:underline transition-colors duration-200">Help</a>
    </div>
  </div>
</div>
