<div class="card slide-in-up">
  <div class="text-center mb-6">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Forgot Password</h1>
    <p class="mt-2 text-gray-600 dark:text-gray-300">Enter your email to receive a password reset link</p>
  </div>

  <!-- Alert for errors -->
  <app-alert
    *ngIf="errorMessage"
    type="error"
    [message]="errorMessage"
    class="mb-4"
    (dismissed)="errorMessage = ''"
  ></app-alert>

  <!-- Alert for success -->
  <app-alert
    *ngIf="successMessage"
    type="success"
    [message]="successMessage"
    class="mb-4"
    (dismissed)="successMessage = ''"
  ></app-alert>

  <!-- Password Reset Request Form -->
  <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Email Input -->
    <app-input
      label="Email Address"
      type="email"
      formControlName="email"
      placeholder="Your email address"
      autocomplete="email"
      [icon]="'fas fa-envelope'"
      iconPosition="left"
      [validationMessages]="{
        required: 'Email is required',
        email: 'Please enter a valid email address'
      }"
      [required]="true"
    ></app-input>

    <!-- Submit Button -->
    <app-button
      type="submit"
      variant="primary"
      [fullWidth]="true"
      [loading]="isLoading"
      [disabled]="forgotPasswordForm.invalid || isLoading"
    >
      Send Reset Link
    </app-button>

    <!-- Back to Login Button -->
    <app-button
      type="button"
      variant="secondary"
      [fullWidth]="true"
      routerLink="/auth/login"
    >
      Back to Login
    </app-button>
  </form>
</div>
