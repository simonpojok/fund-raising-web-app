<div class="card slide-in-up">
  <div class="text-center mb-6">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Reset Password</h1>
    <p class="mt-2 text-gray-600 dark:text-gray-300">Create a new password for your account</p>
  </div>

  <!-- Alert for errors -->
  <app-alert
    *ngIf="errorMessage"
    type="error"
    [message]="errorMessage"
    class="mb-4"
    (dismissed)="errorMessage = ''"
  ></app-alert>

  <!-- Alert for success -->
  <app-alert
    *ngIf="successMessage"
    type="success"
    [message]="successMessage"
    class="mb-4"
    (dismissed)="successMessage = ''"
  ></app-alert>

  <!-- Reset Password Form -->
  <form *ngIf="!successMessage" [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- New Password Input -->
    <app-input
      label="New Password"
      type="password"
      formControlName="new_password"
      placeholder="Enter new password"
      autocomplete="new-password"
      [icon]="'fas fa-lock'"
      iconPosition="left"
      [validationMessages]="{
        required: 'New password is required',
        minlength: 'Password must be at least 8 characters'
      }"
      [required]="true"
    ></app-input>

    <!-- Confirm Password Input -->
    <app-input
      label="Confirm Password"
      type="password"
      formControlName="confirm_password"
      placeholder="Confirm new password"
      autocomplete="new-password"
      [icon]="'fas fa-lock'"
      iconPosition="left"
      [validationMessages]="{
        required: 'Please confirm your password',
        passwordMismatch: 'Passwords do not match'
      }"
      [required]="true"
    ></app-input>

    <!-- Submit Button -->
    <app-button
      type="submit"
      variant="primary"
      [fullWidth]="true"
      [loading]="isLoading"
      [disabled]="resetPasswordForm.invalid || isLoading || !token || !uid"
    >
      Reset Password
    </app-button>

    <!-- Back to Login Button -->
    <app-button
      type="button"
      variant="secondary"
      [fullWidth]="true"
      routerLink="/auth/login"
    >
      Back to Login
    </app-button>
  </form>
</div>
