<nav aria-label="Campaign creation progress" class="py-6">
  <ol class="overflow-hidden">
    <li
      *ngFor="let step of steps; let stepIndex = index"
      [class]="getStepClasses(step)"
      (click)="onStepClick(step.id)"
    >
      <div class="pl-8 pr-4 py-4 flex items-center">
        <!-- Step connector line (for all steps except the last) -->
        <div *ngIf="stepIndex < steps.length - 1" [class]="getStepConnectorClasses(stepIndex)"></div>

        <!-- Step number/icon -->
        <span [class]="getStepNumberClasses(step)">
          <!-- Completed step - show checkmark -->
          <svg
            *ngIf="getStepStatus(step) === 'completed'"
            class="h-5 w-5"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              fill-rule="evenodd"
              d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
              clip-rule="evenodd"
            />
          </svg>
          <!-- Other steps - show number -->
          <span *ngIf="getStepStatus(step) !== 'completed'">{{ step.id }}</span>
        </span>

        <!-- Step content -->
        <div class="ml-4 min-w-0 flex-1">
          <h3 class="text-sm font-medium"
              [class.text-gray-900]="getStepStatus(step) === 'current'"
              [class.dark:text-white]="getStepStatus(step) === 'current'"
              [class.text-gray-500]="getStepStatus(step) !== 'current'"
              [class.dark:text-gray-400]="getStepStatus(step) !== 'current'">
            {{ step.title }}
          </h3>
          <p class="text-xs text-gray-500 dark:text-gray-400">{{ step.description }}</p>
        </div>

        <!-- Current step indicator -->
        <div *ngIf="getStepStatus(step) === 'current'" class="ml-4">
          <svg class="h-5 w-5 text-primary-600 dark:text-primary-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 0l-3 3a1 1 0 001.414 1.414L9 9.414V13a1 1 0 002 0V9.414l1.293 1.293a1 1 0 001.414-1.414z" clip-rule="evenodd" />
          </svg>
        </div>
      </div>
    </li>
  </ol>
</nav>
