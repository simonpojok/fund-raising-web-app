<nav aria-label="Campaign creation progress" class="py-6">
  <!-- Progress Bar Background -->
  <div class="mb-8">
    <div class="flex items-center">
      <div class="flex-1 flex items-center justify-between relative">
        <!-- Progress Line Background -->
        <div class="absolute top-5 left-5 right-5 h-0.5 bg-gray-300 dark:bg-gray-600 z-0"></div>

        <!-- Active Progress Line -->
        <div
          class="absolute top-5 left-5 h-0.5 bg-primary-600 dark:bg-primary-400 z-0 transition-all duration-500"
          [style.width]="getProgressLineWidth() + '%'"
        ></div>

        <!-- Step Items -->
        <div
          *ngFor="let step of steps; let stepIndex = index"
          class="relative z-10 flex flex-col items-center group cursor-pointer"
          [class.pointer-events-none]="!canNavigateToStep(step.id)"
          (click)="onStepClick(step.id)"
        >
          <!-- Step Circle -->
          <div [class]="getStepCircleClasses(step)">
            <!-- Completed Step - Checkmark -->
            <svg
              *ngIf="getStepStatus(step) === 'completed'"
              class="h-5 w-5 text-white"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path
                fill-rule="evenodd"
                d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                clip-rule="evenodd"
              />
            </svg>

            <!-- Current Step - Pulse Animation -->
            <span
              *ngIf="getStepStatus(step) === 'current'"
              class="text-white font-semibold"
            >
              {{ step.id }}
            </span>

            <!-- Upcoming/Disabled Step - Number -->
            <span
              *ngIf="getStepStatus(step) === 'upcoming' || getStepStatus(step) === 'disabled'"
              class="font-semibold"
            >
              {{ step.id }}
            </span>
          </div>

          <!-- Step Labels -->
          <div class="mt-3 text-center hidden sm:block">
            <p [class]="getStepLabelClasses(step)" class="text-sm font-medium truncate max-w-24 lg:max-w-32">
              {{ step.title }}
            </p>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1 truncate max-w-24 lg:max-w-32">
              {{ step.description }}
            </p>
          </div>

          <!-- Mobile: Show only current step label -->
          <div class="mt-3 text-center sm:hidden" *ngIf="getStepStatus(step) === 'current'">
            <p class="text-sm font-medium text-gray-900 dark:text-white">
              {{ step.title }}
            </p>
            <p class="text-xs text-gray-500 dark:text-gray-400">
              {{ step.description }}
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Step Selector -->
  <div class="sm:hidden">
    <select
      [value]="currentStep"
      (change)="onMobileStepChange($event)"
      class="block w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500 text-gray-900 dark:text-white"
    >
      <option
        *ngFor="let step of steps"
        [value]="step.id"
        [disabled]="!canNavigateToStep(step.id)"
      >
        Step {{ step.id }}: {{ step.title }}
      </option>
    </select>
  </div>

  <!-- Alternative: Mobile Step Indicators -->

  <div class="flex justify-center sm:hidden mt-4">

      <button
        *ngFor="let step of steps"

        <span class="sr-only">Step {{ step.id }}</span>
      </button>
    </div>
  </div>
  -->
</nav>
