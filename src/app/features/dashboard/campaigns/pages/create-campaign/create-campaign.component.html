<div class="min-h-screen bg-gray-50 dark:bg-gray-900">
  <!-- Header -->
  <div class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 shadow-sm">
    <div class="container mx-auto px-4 py-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Create New Campaign</h1>
          <p class="mt-2 text-gray-600 dark:text-gray-300">
            Launch your fundraising campaign and start collecting contributions.
          </p>
        </div>

        <!-- Progress indicator -->
        <div class="hidden md:block">
          <div class="flex items-center space-x-3">
            <span class="text-sm font-medium text-gray-700 dark:text-gray-300">
              Step {{ currentStep }} of {{ totalSteps }}
            </span>
            <div class="w-32 bg-gray-200 dark:bg-gray-700 rounded-full h-2">
              <div
                class="bg-primary-600 h-2 rounded-full transition-all duration-500 ease-out"
                [style.width.%]="getCompletionPercentage()"
              ></div>
            </div>
            <span class="text-sm text-gray-500 dark:text-gray-400">
              {{ getCompletionPercentage() }}%
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container mx-auto py-8">
    <!-- Alert Messages -->
    <app-alert
      *ngIf="errorMessage"
      type="error"
      [message]="errorMessage"
      class="mb-6"
      (dismissed)="errorMessage = ''"
    ></app-alert>

    <app-alert
      *ngIf="successMessage"
      type="success"
      [message]="successMessage"
      class="mb-6"
      (dismissed)="successMessage = ''"
    ></app-alert>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="flex justify-center py-12">
      <app-spinner [size]="'lg'" [showLabel]="true" label="Loading..."></app-spinner>
    </div>

    <!-- Form Content -->
    <div class="space-y-6">
      <!-- Step 1: Basic Information -->
      <div *ngIf="currentStep === 1" class="animate-fade-in">
        <app-basic-info-card
          [formGroup]="basicInfoFormGroup"
          [categories]="categories"
          [loadingCategories]="loadingCategories"
          [bannerPreview]="bannerPreview"
          [videoPreview]="videoPreview"
          [selectedBanner]="selectedBanner"
          [selectedVideo]="selectedVideo"
          (amountInput)="onAmountInput($event)"
          (bannerSelected)="onBannerSelected($event)"
          (videoSelected)="onVideoSelected($event)"
          (bannerRemoved)="removeBanner()"
          (videoRemoved)="removeVideo()"
        ></app-basic-info-card>
      </div>

      <!-- Step 2: Settings and Payment Methods -->
      <div *ngIf="currentStep === 2" class="animate-fade-in">
        <app-settings-payment-card
          [formGroup]="settingsFormGroup"
          [supportedPaymentMethods]="supportedPaymentMethods"
          [loadingPaymentMethods]="loadingPaymentMethods"
          (addPaymentMethod)="addPaymentMethod()"
          (removePaymentMethod)="removePaymentMethod($event)"
          (addPredefinedPaymentMethod)="addPredefinedPaymentMethod($event)"
          [getPaymentMethodName]="getPaymentMethodName.bind(this)"
          [isPaymentMethodAdded]="isPaymentMethodAdded.bind(this)"
        ></app-settings-payment-card>
      </div>

      <!-- Step Navigation -->
      <div class="flex justify-between items-center bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-6">
        <div class="flex items-center space-x-4">
          <button
            *ngIf="currentStep > 1"
            type="button"
            (click)="previousStep()"
            class="inline-flex items-center px-4 py-2 border border-gray-300 dark:border-gray-600 shadow-sm text-sm font-medium rounded-md text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors"
            [disabled]="isSaving"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            Previous
          </button>

          <button
            type="button"
            (click)="saveDraft()"
            class="inline-flex items-center px-4 py-2 border border-gray-300 dark:border-gray-600 shadow-sm text-sm font-medium rounded-md text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors"
            [disabled]="isSaving"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3-3m0 0l-3 3m3-3v12" />
            </svg>
            Save Draft
          </button>
        </div>

        <div class="flex items-center space-x-3">
          <button
            type="button"
            (click)="cancel()"
            class="inline-flex items-center px-4 py-2 border border-gray-300 dark:border-gray-600 shadow-sm text-sm font-medium rounded-md text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-colors"
            [disabled]="isSaving"
          >
            Cancel
          </button>

          <button
            *ngIf="currentStep < totalSteps"
            type="button"
            (click)="nextStep()"
            class="inline-flex items-center px-6 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="isSaving || (currentStep === 1 && !isStep1Valid())"
          >
            Next Step
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </button>

          <button
            *ngIf="currentStep === totalSteps"
            type="button"
            (click)="nextStep()"
            class="inline-flex items-center px-6 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-success hover:bg-success-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-success transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="isSaving || !isStep2Valid()"
            [class.animate-pulse]="isSaving"
          >
            <svg *ngIf="isSaving" class="animate-spin -ml-1 mr-3 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <svg *ngIf="!isSaving" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            </svg>
            {{ isSaving ? 'Creating...' : 'Create Campaign' }}
          </button>
        </div>
      </div>
    </div>

    <!-- Mobile Progress Indicator -->
    <div class="lg:hidden mt-6 bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700">
      <div class="flex items-center justify-between mb-2">
        <span class="text-sm font-medium text-gray-700 dark:text-gray-300">
          Step {{ currentStep }} of {{ totalSteps }}
        </span>
        <span class="text-sm text-gray-500 dark:text-gray-400">
          {{ getCompletionPercentage() }}% complete
        </span>
      </div>
      <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2">
        <div
          class="bg-primary-600 h-2 rounded-full transition-all duration-500"
          [style.width.%]="getCompletionPercentage()"
        ></div>
      </div>
    </div>
  </div>
</div>
