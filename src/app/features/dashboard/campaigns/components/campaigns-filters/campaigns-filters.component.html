<div class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 filter-section">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
    <!-- Search and Sort Row -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-4 search-and-sort">
      <!-- Search Input -->
      <div class="flex-1 max-w-lg">
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 dark:text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
          <input
            type="text"
            formControlName="search"
            placeholder="Search campaigns..."
            class="search-input block w-full pl-10 pr-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 shadow-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:text-white transition-all duration-200"
          />
        </div>
      </div>

      <!-- Sort and Filter Toggle -->
      <div class="flex items-center space-x-3 mt-3 md:mt-0">
        <!-- Sort Dropdown -->
        <select
          formControlName="sort"
          class="sort-dropdown text-sm rounded-lg border border-gray-300 dark:border-gray-600 px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all duration-200"
        >
          <option *ngFor="let option of sortOptions" [value]="option.value">
            {{ option.label }}
          </option>
        </select>

        <!-- Advanced Filters Toggle -->
        <button
          type="button"
          (click)="toggleExpanded()"
          class="inline-flex items-center px-3 py-2 border border-gray-300 dark:border-gray-600 shadow-sm text-sm font-medium rounded-md text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors"
          [class.bg-primary-50]="isExpanded"
          [class.dark:bg-primary-900]="isExpanded"
          [class.text-primary-700]="isExpanded"
          [class.dark:text-primary-300]="isExpanded"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.414A1 1 0 013 6.707V4z" />
          </svg>
          Filters
          <span *ngIf="activeFiltersCount > 0" class="ml-2 inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-primary-100 text-primary-800 dark:bg-primary-900 dark:text-primary-200">
            {{ activeFiltersCount }}
          </span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-2 transform transition-transform" [class.rotate-180]="isExpanded" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Quick Filter Pills -->
    <div class="flex flex-wrap gap-2 mb-4 filter-pills">
      <button
        type="button"
        (click)="setActiveFilter()"
        class="filter-pill inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200 hover:bg-green-200 dark:hover:bg-green-800"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        Active
      </button>

      <button
        type="button"
        (click)="setUrgentFilter()"
        class="filter-pill inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200 hover:bg-red-200 dark:hover:bg-red-800"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z" />
        </svg>
        Urgent
      </button>

      <button
        type="button"
        (click)="setMyCreatedFilter()"
        class="filter-pill inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 hover:bg-blue-200 dark:hover:bg-blue-800"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
        </svg>
        My Campaigns
      </button>

      <button
        type="button"
        (click)="setMyContributedFilter()"
        class="filter-pill inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-purple-100 text-purple-800 dark:bg-purple-900 dark:text-purple-200 hover:bg-purple-200 dark:hover:bg-purple-800"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        My Contributions
      </button>
    </div>

    <!-- Advanced Filters Panel -->
    <div *ngIf="isExpanded" class="filters-expanded border-t border-gray-200 dark:border-gray-700 pt-4">
      <form [formGroup]="filtersForm">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 filter-grid">
          <!-- Category Filter -->
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Category</label>
            <select
              formControlName="category"
              class="block w-full px-3 py-2 rounded-md border border-gray-300 dark:border-gray-600 shadow-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:text-white transition-all duration-200"
              [disabled]="loadingCategories"
            >
              <option value="">All Categories</option>
              <option *ngFor="let category of categories" [value]="category.id">
                {{ category.name }}
              </option>
            </select>
            <div *ngIf="loadingCategories" class="mt-1 text-xs text-gray-500 dark:text-gray-400">
              Loading categories...
            </div>
          </div>

          <!-- Status Filter -->
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Status</label>
            <select
              formControlName="status"
              class="block w-full px-3 py-2 rounded-md border border-gray-300 dark:border-gray-600 shadow-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:text-white transition-all duration-200"
            >
              <option *ngFor="let option of statusOptions" [value]="option.value">
                {{ option.label }}
              </option>
            </select>
          </div>

          <!-- Min Amount Filter -->
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Minimum Goal</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <span class="text-gray-500 dark:text-gray-400 text-sm">UGX</span>
              </div>
              <input
                type="text"
                formControlName="min_amount"
                (input)="onAmountInput($event, 'min_amount')"
                placeholder="0"
                class="block w-full pl-12 pr-4 py-2 rounded-md border border-gray-300 dark:border-gray-600 shadow-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:text-white transition-all duration-200"
              />
            </div>
          </div>

          <!-- Max Amount Filter -->
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Maximum Goal</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <span class="text-gray-500 dark:text-gray-400 text-sm">UGX</span>
              </div>
              <input
                type="text"
                formControlName="max_amount"
                (input)="onAmountInput($event, 'max_amount')"
                placeholder="No limit"
                class="block w-full pl-12 pr-4 py-2 rounded-md border border-gray-300 dark:border-gray-600 shadow-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:text-white transition-all duration-200"
              />
            </div>
          </div>
        </div>

        <!-- Additional Filter Options -->
        <div class="mt-4 space-y-3">
          <div class="flex flex-wrap gap-6">
            <!-- Urgency Filter -->
            <div class="flex items-center">
              <input
                id="is_urgent"
                type="checkbox"
                formControlName="is_urgent"
                class="w-4 h-4 text-primary-600 border-gray-300 rounded focus:ring-primary-500 dark:bg-gray-700 dark:border-gray-600"
              />
              <label for="is_urgent" class="ml-2 text-sm text-gray-700 dark:text-gray-300">
                Urgent campaigns only
              </label>
            </div>

            <!-- Visibility Filter -->
            <div class="flex items-center">
              <input
                id="is_public"
                type="checkbox"
                formControlName="is_public"
                class="w-4 h-4 text-primary-600 border-gray-300 rounded focus:ring-primary-500 dark:bg-gray-700 dark:border-gray-600"
              />
              <label for="is_public" class="ml-2 text-sm text-gray-700 dark:text-gray-300">
                Public campaigns only
              </label>
            </div>

            <!-- My Created Filter -->
            <div class="flex items-center">
              <input
                id="created_by_me"
                type="checkbox"
                formControlName="created_by_me"
                class="w-4 h-4 text-primary-600 border-gray-300 rounded focus:ring-primary-500 dark:bg-gray-700 dark:border-gray-600"
              />
              <label for="created_by_me" class="ml-2 text-sm text-gray-700 dark:text-gray-300">
                Created by me
              </label>
            </div>

            <!-- My Contributed Filter -->
            <div class="flex items-center">
              <input
                id="contributed_by_me"
                type="checkbox"
                formControlName="contributed_by_me"
                class="w-4 h-4 text-primary-600 border-gray-300 rounded focus:ring-primary-500 dark:bg-gray-700 dark:border-gray-600"
              />
              <label for="contributed_by_me" class="ml-2 text-sm text-gray-700 dark:text-gray-300">
                I contributed to
              </label>
            </div>
          </div>
        </div>

        <!-- Filter Actions -->
        <div class="mt-4 flex items-center justify-between">
          <div class="text-sm text-gray-500 dark:text-gray-400">
            <span *ngIf="activeFiltersCount === 0">No filters applied</span>
            <span *ngIf="activeFiltersCount > 0">{{ activeFiltersCount }} filter{{ activeFiltersCount > 1 ? 's' : '' }} applied</span>
          </div>

          <button
            type="button"
            (click)="clearAllFilters()"
            class="clear-button inline-flex items-center px-3 py-1.5 border border-gray-300 dark:border-gray-600 shadow-sm text-sm font-medium rounded-md text-red-700 dark:text-red-400 bg-white dark:bg-gray-700 hover:bg-red-50 dark:hover:bg-red-900/20 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-colors"
            [disabled]="activeFiltersCount === 0"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            Clear All
          </button>
        </div>
      </form>
    </div>

    <!-- Active Filters Tags -->
    <div *ngIf="activeFiltersCount > 0 && !isExpanded" class="flex flex-wrap gap-2 mt-3">
      <span
        *ngIf="filtersForm.get('category')?.value"
        class="active-filter-tag inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200"
      >
        {{ getCategoryName(filtersForm.get('category')?.value) }}
        <button
          type="button"
          (click)="filtersForm.patchValue({ category: '' })"
          class="ml-1 inline-flex items-center justify-center"
        >
          ×
        </button>
      </span>

      <span
        *ngIf="filtersForm.get('status')?.value && filtersForm.get('status')?.value !== 'all'"
        class="active-filter-tag inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200"
      >
        {{ getStatusLabel(filtersForm.get('status')?.value) }}
        <button
          type="button"
          (click)="filtersForm.patchValue({ status: 'all' })"
          class="ml-1 inline-flex items-center justify-center"
        >
          ×
        </button>
      </span>

      <span
        *ngIf="filtersForm.get('is_urgent')?.value"
        class="active-filter-tag inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200"
      >
        Urgent
        <button
          type="button"
          (click)="filtersForm.patchValue({ is_urgent: false })"
          class="ml-1 inline-flex items-center justify-center"
        >
          ×
        </button>
      </span>

      <span
        *ngIf="filtersForm.get('created_by_me')?.value"
        class="active-filter-tag inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-purple-100 text-purple-800 dark:bg-purple-900 dark:text-purple-200"
      >
        My Campaigns
        <button
          type="button"
          (click)="filtersForm.patchValue({ created_by_me: false })"
          class="ml-1 inline-flex items-center justify-center"
        >
          ×
        </button>
      </span>

      <span
        *ngIf="filtersForm.get('contributed_by_me')?.value"
        class="active-filter-tag inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-orange-100 text-orange-800 dark:bg-orange-900 dark:text-orange-200"
      >
        My Contributions
        <button
          type="button"
          (click)="filtersForm.patchValue({ contributed_by_me: false })"
          class="ml-1 inline-flex items-center justify-center"
        >
          ×
        </button>
      </span>
    </div>
  </div>
</div>
