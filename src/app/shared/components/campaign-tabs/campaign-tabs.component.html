<div class="w-full">
  <!-- Tab buttons -->
  <div class="flex border-b border-gray-200 dark:border-gray-700 mb-4">
    <button type="button"
            class="py-2 px-4 text-sm font-medium border-b-2 focus:outline-none"
            [class.border-primary-500]="activeTab === 'contributed'"
            [class.text-primary-600]="activeTab === 'contributed'"
            [class.dark:text-primary-400]="activeTab === 'contributed'"
            [class.border-transparent]="activeTab !== 'contributed'"
            [class.text-gray-500]="activeTab !== 'contributed'"
            [class.dark:text-gray-400]="activeTab !== 'contributed'"
            [class.hover:text-gray-700]="activeTab !== 'contributed'"
            [class.dark:hover:text-gray-300]="activeTab !== 'contributed'"
            (click)="selectTab('contributed')">
      Contributing ({{ contributedCampaigns.length }})
    </button>
    <button type="button"
            class="py-2 px-4 text-sm font-medium border-b-2 focus:outline-none"
            [class.border-primary-500]="activeTab === 'created'"
            [class.text-primary-600]="activeTab === 'created'"
            [class.dark:text-primary-400]="activeTab === 'created'"
            [class.border-transparent]="activeTab !== 'created'"
            [class.text-gray-500]="activeTab !== 'created'"
            [class.dark:text-gray-400]="activeTab !== 'created'"
            [class.hover:text-gray-700]="activeTab !== 'created'"
            [class.dark:hover:text-gray-300]="activeTab !== 'created'"
            (click)="selectTab('created')">
      Created ({{ createdCampaigns.length }})
    </button>
  </div>

  <!-- Loading state -->
  <div *ngIf="loading" class="flex justify-center py-6">
    <div
      class="inline-block h-6 w-6 animate-spin rounded-full border-4 border-solid border-primary-600 border-r-transparent"></div>
  </div>

  <!-- Empty state -->
  <div *ngIf="!loading &&
              ((activeTab === 'contributed' && contributedCampaigns.length === 0) ||
               (activeTab === 'created' && createdCampaigns.length === 0))"
       class="py-6 text-center text-gray-500 dark:text-gray-400">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mx-auto mb-2 text-gray-400 dark:text-gray-500" fill="none"
         viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
    </svg>
    <p *ngIf="activeTab === 'contributed'">You are not contributing to any campaigns yet.</p>
    <p *ngIf="activeTab === 'created'">You haven't created any campaigns yet.</p>
  </div>

  <!-- Campaign list -->
  <div *ngIf="!loading &&
              ((activeTab === 'contributed' && contributedCampaigns.length > 0) ||
               (activeTab === 'created' && createdCampaigns.length > 0))"
       class="space-y-2">
    <!-- Campaign items -->
    <button *ngFor="let campaign of activeTab === 'contributed' ? contributedCampaigns : createdCampaigns"
            type="button"
            class="w-full flex items-center p-3 rounded-lg border transition-colors duration-150 cursor-pointer"
            [class.border-primary-300]="selectedCampaignId === campaign.id"
            [class.dark:border-primary-700]="selectedCampaignId === campaign.id"
            [class.bg-primary-50]="selectedCampaignId === campaign.id"
            [class.dark:bg-primary-900]="selectedCampaignId === campaign.id"
            [class.border-gray-200]="selectedCampaignId !== campaign.id"
            [class.dark:border-gray-700]="selectedCampaignId !== campaign.id"
            [class.hover:bg-gray-50]="selectedCampaignId !== campaign.id"
            [class.dark:hover:bg-gray-800]="selectedCampaignId !== campaign.id"
            (click)="selectCampaign(campaign)">
      <!-- Campaign image if available -->
      <div *ngIf="campaign.banner_url" class="h-12 w-12 flex-shrink-0 rounded-md overflow-hidden mr-3">
        <img [src]="campaign.banner_url" [alt]="campaign.title" class="h-full w-full object-cover">
      </div>

      <!-- Placeholder image if no banner -->
      <div *ngIf="!campaign.banner_url"
           class="h-12 w-12 flex-shrink-0 rounded-md overflow-hidden mr-3 bg-gray-200 dark:bg-gray-700 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-400 dark:text-gray-500" fill="none"
             viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
        </svg>
      </div>

      <!-- Campaign details -->
      <div class="flex-1 min-w-0">
        <h3 class="text-sm font-medium text-gray-900 dark:text-white truncate">
          {{ campaign.title }}
        </h3>

        <!-- Progress bar -->
        <div class="w-full bg-gray-200 dark:bg-gray-700 h-1.5 rounded-full mt-2">
          <div class="h-1.5 rounded-full"
               [style.width.%]="campaign.progress_percentage"
               [class]="getProgressClass(campaign)"></div>
        </div>

        <!-- Progress info -->
        <div class="mt-1 flex justify-between text-xs text-gray-500 dark:text-gray-400">
          <span>{{ campaign.progress_percentage }}%</span>
          <span>{{ campaign.days_remaining }} {{ campaign.days_remaining === 1 ? 'day' : 'days' }} left</span>
        </div>
      </div>

      <!-- Urgent tag -->
      <div *ngIf="campaign.is_urgent" class="ml-2 flex-shrink-0">
        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-danger text-white">
          URGENT
        </span>
      </div>
    </button>
  </div>
</div>
