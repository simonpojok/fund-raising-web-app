<div class="card card-hover h-full flex flex-col">
  <!-- Campaign Image -->
  <div *ngIf="campaign.banner_url" class="relative overflow-hidden rounded-t-xl -mx-6 -mt-6 mb-4">
    <img [src]="campaign.banner_url" [alt]="campaign.title" class="w-full h-48 object-cover">

    <!-- Urgent label -->
    <div *ngIf="campaign.is_urgent"
         class="absolute top-2 left-2 bg-danger text-white text-xs font-bold px-2 py-1 rounded-md">
      URGENT
    </div>

    <!-- Days remaining badge -->
    <div class="absolute top-2 right-2 bg-black bg-opacity-70 text-white text-xs font-medium px-2 py-1 rounded-full">
      {{ daysText }}
    </div>
  </div>

  <!-- Campaign header - show if no image or compact mode -->
  <div *ngIf="!campaign.banner_url || compact" class="flex justify-between items-start">
    <h3 class="text-lg font-bold text-gray-900 dark:text-white">{{ campaign.title }}</h3>

    <!-- Category tag -->
    <span *ngIf="campaign.category && !compact"
          class="inline-block bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 text-xs px-2 py-1 rounded-full">
      {{ campaign.category }}
    </span>
  </div>

  <!-- If image exists, show title below -->
  <h3 *ngIf="campaign.banner_url && !compact" class="text-lg font-bold text-gray-900 dark:text-white mb-2">{{ campaign.title }}</h3>

  <!-- Campaign description -->
  <p *ngIf="!compact" class="text-sm text-gray-600 dark:text-gray-300 mb-4 line-clamp-2">{{ campaign.short_description }}</p>

  <!-- Progress section -->
  <div class="mt-auto pt-4">
    <!-- Progress bar -->
    <app-progress-bar
      [progress]="campaign.progress_percentage"
      [color]="getProgressColor()"
      [showPercentage]="true"
    ></app-progress-bar>

    <!-- Progress details -->
    <div class="flex justify-between mt-2 text-sm">
      <div>
        <span class="font-medium text-gray-900 dark:text-white">{{ formatCurrency(campaign.total_contributed) }}</span>
        <span class="text-gray-500 dark:text-gray-400"> raised</span>
      </div>
      <div class="text-right">
        <span class="text-gray-500 dark:text-gray-400">Goal: </span>
        <span class="font-medium text-gray-900 dark:text-white">{{ formatCurrency(campaign.target_amount) }}</span>
      </div>
    </div>
  </div>

  <!-- Action buttons -->
  <div *ngIf="showActions && !compact" class="flex mt-4 pt-4 border-t border-gray-200 dark:border-gray-700">
    <a [routerLink]="['/dashboard/campaigns', campaign.id]"
       class="flex-1 inline-flex justify-center items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
      View Details
    </a>
    <button type="button"
            class="ml-3 inline-flex justify-center items-center px-4 py-2 border border-gray-300 dark:border-gray-600 text-sm font-medium rounded-md text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
      </svg>
      Share
    </button>
  </div>
</div>
