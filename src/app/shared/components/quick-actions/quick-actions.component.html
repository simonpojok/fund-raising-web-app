<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
  <ng-container *ngFor="let action of actions">
    <!-- Action button with route -->
    <a *ngIf="action.route"
       [routerLink]="action.route"
       class="inline-flex items-center justify-center px-4 py-3 border border-transparent rounded-lg shadow-sm text-sm font-medium"
       [class]="action.bgColor + ' ' + action.textColor">
      <span [innerHTML]="action.icon"></span>
      {{ action.label }}
    </a>

    <!-- Action button with click handler -->
    <button *ngIf="action.action"
            (click)="action.action()"
            type="button"
            class="inline-flex items-center justify-center px-4 py-3 border border-transparent rounded-lg shadow-sm text-sm font-medium"
            [class]="action.bgColor + ' ' + action.textColor">
      <span [innerHTML]="action.icon"></span>
      {{ action.label }}
    </button>
  </ng-container>
</div>
