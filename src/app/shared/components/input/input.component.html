<div [class]="containerClasses">
  <!-- Label -->
  <label
    *ngIf="label"
    [for]="ngControl?.name"
    [class]="labelClasses"
  >
    {{ label }}
    <span *ngIf="required" class="text-danger ml-0.5">*</span>
  </label>

  <!-- Input container with icon positioning -->
  <div class="relative">
    <!-- Left icon -->
    <div
      *ngIf="icon && iconPosition === 'left'"
      class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-500 dark:text-gray-400"
    >
      <i [class]="icon"></i>
    </div>

    <!-- Input field -->
    <input
      [type]="getInputType()"
      [id]="ngControl?.name"
      [formControl]="internalControl"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [required]="required"
      [attr.autocomplete]="autocomplete"
      [class]="inputClasses"
      (focus)="onFocus()"
      (blur)="onBlur()"
      [class.border-danger-500]="hasErrors"
    />

    <!-- Right icon (or password toggle) -->
    <div
      *ngIf="icon && iconPosition === 'right' || type === 'password'"
      class="absolute inset-y-0 right-0 pr-3 flex items-center"
    >
      <!-- Password toggle -->
      <button
        *ngIf="type === 'password'"
        type="button"
        tabindex="-1"
        class="text-gray-500 dark:text-gray-400 focus:outline-none"
        (click)="togglePasswordVisibility()"
      >
        <!-- Eye icon when password is hidden -->
        <svg
          *ngIf="!showPassword"
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
          />
        </svg>

        <!-- Eye-off icon when password is visible -->
        <svg
          *ngIf="showPassword"
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"
          />
        </svg>
      </button>

      <!-- Custom right icon if provided and not password -->
      <i *ngIf="icon && iconPosition === 'right' && type !== 'password'" [class]="icon + ' text-gray-500 dark:text-gray-400'"></i>
    </div>
  </div>

  <!-- Helper text -->
  <div *ngIf="helperText && !hasErrors" class="mt-1 text-sm text-gray-500 dark:text-gray-400">
    {{ helperText }}
  </div>

  <!-- Error message -->
  <div *ngIf="hasErrors && errorMessage" class="mt-1 input-error">
    {{ errorMessage }}
  </div>
</div>
